name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-launcher-windows:
    name: npm launcher on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up minimum supported Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Lint npm launcher
        run: npm --prefix npm run lint

      - name: Test npm launcher
        run: npm --prefix npm test

  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node for npm launcher checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked development environment
        run: make sync

      - name: Lint
        run: make lint

      - name: Test distributions
        run: make test

      - name: Build wheel and source distribution
        run: make build

      - name: Build local one-file binary
        run: make binary

  binary-release-validation:
    name: Four-platform binary release validation
    uses: ./.github/workflows/binary-release.yml
    with:
      attest: false
    permissions:
      contents: read
      id-token: write
      attestations: write
