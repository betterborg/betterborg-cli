name: Release BetterBorg

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed version from betterborg_cli.__version__
        required: true
        type: string
      publish:
        description: Publish after validation and protected environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release without publishing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node for npm launcher checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked development environment
        run: make sync

      - name: Validate reviewed version
        env:
          REVIEWED_VERSION: ${{ inputs.version }}
        run: .venv/bin/python scripts/check_versions.py --expected "$REVIEWED_VERSION"

      - name: Lint and test
        run: |
          make lint
          make test

      - name: Build wheel and source distribution
        run: make build

      - name: Require the exact wheel and source distribution
        env:
          REVIEWED_VERSION: ${{ inputs.version }}
        run: |
          .venv/bin/python - "$REVIEWED_VERSION" <<'PY'
          import sys
          from pathlib import Path

          version = sys.argv[1]
          expected = {
              f"betterborg-{version}-py3-none-any.whl",
              f"betterborg-{version}.tar.gz",
          }
          actual = {path.name for path in Path("dist").iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(
                  f"release artifacts differ: expected {sorted(expected)}, "
                  f"found {sorted(actual)}"
              )
          PY

      - name: Preserve reviewed distributions
        uses: actions/upload-artifact@v4
        with:
          name: betterborg-${{ inputs.version }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/betterborg-${{ inputs.version }}-py3-none-any.whl
            dist/betterborg-${{ inputs.version }}.tar.gz

  publish-pypi:
    name: Publish reviewed distributions to PyPI
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    needs: [validate-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/betterborg/${{ inputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out verification code
        uses: actions/checkout@v4

      - name: Retrieve reviewed distributions
        uses: actions/download-artifact@v4
        with:
          name: betterborg-${{ inputs.version }}
          path: dist

      - name: Publish with the PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false

      - name: Set up uv for public verification
        uses: astral-sh/setup-uv@v6

      - name: Verify exact public command and controlled init
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEWED_VERSION: ${{ inputs.version }}
        run: python scripts/verify_pypi_release.py --version "$REVIEWED_VERSION"

  pypi-verification-gate:
    name: Require verified PyPI release before binaries
    if: >-
      ${{ always() && needs.validate-release.result == 'success' &&
          ((!inputs.publish) || needs.publish-pypi.result == 'success') }}
    needs: [validate-release, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification fixtures
        if: ${{ !inputs.publish }}
        uses: actions/checkout@v4

      - name: Set up fixture test Python
        if: ${{ !inputs.publish }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate PyPI verification without registry access
        if: ${{ !inputs.publish }}
        run: |
          make sync
          .venv/bin/pytest tests/test_release_workflow.py

      - name: Confirm protected PyPI verification
        if: ${{ inputs.publish }}
        run: echo "Protected PyPI upload and verification completed."

  build-binaries:
    name: Build four-platform standalone release
    needs: [pypi-verification-gate]
    uses: ./.github/workflows/binary-release.yml
    with:
      version: ${{ inputs.version }}
      attest: ${{ inputs.publish }}
    permissions:
      contents: read
      id-token: write
      attestations: write

  validate-github-reconciliation:
    name: Validate GitHub Release reconciliation without publishing
    if: ${{ !inputs.publish }}
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out reconciliation fixtures
        uses: actions/checkout@v4

      - name: Set up fixture test Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Exercise digest reconciliation fixtures
        run: |
          make sync
          .venv/bin/pytest tests/test_binary_release.py

  reconcile-github-release:
    name: Digest-gate and publish GitHub Release
    if: ${{ inputs.publish }}
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out reconciliation code
        uses: actions/checkout@v4

      - name: Retrieve complete reviewed binary release
        uses: actions/download-artifact@v4
        with:
          name: binary-release-${{ inputs.version }}
          path: release-assets

      - name: Reconcile only matching release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/reconcile_github_release.py \
            --version "$REVIEWED_VERSION" \
            --artifacts release-assets \
            --publish
